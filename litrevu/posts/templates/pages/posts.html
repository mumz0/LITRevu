{% extends 'base.html' %}

{% block content %}
<section class="flex flex-col items-center mt-4" role="region" aria-labelledby="posts-heading">
    <h1 id="posts-heading" class="sr-only">Vos publications</h1>
    <div role="feed" aria-label="Liste de vos tickets et critiques">
        {% for item in combined_list %}
            <article class="w-full max-w-md bg-white border border-black rounded-lg overflow-hidden mb-4" 
                     role="article"
                     aria-labelledby="post-{{ forloop.counter }}-title">
                {% if not item.ticket %}
                    {% include 'posts/ticket.html' %}
                {% else %}
                    {% include 'posts/review.html' %}
                {% endif %}
            </article>
        {% endfor %}
    </div>
</section>
{% endblock content %}
